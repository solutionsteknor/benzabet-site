  <script>
  (function () {
    'use strict';
    // Where the address is saved.
    var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyAx90I5icotmSR2tX2DrBplw-H8sqvYJENmyH5_TnKTZK1wR1-OKd54zwfOBdndzjIoQ/exec';
    var WAITS = [1500, 4000];        // pauses before the second and the third try
    var LIMIT = 25000;               // one request is given up after this long
    var PATIENCE = 45000;            // no new try is started after this long

    var form = document.getElementById('notify');
    var input = document.getElementById('email');
    var trap = document.getElementById('trap');
    var done = document.getElementById('done');
    var saved = document.getElementById('saved');
    var change = document.getElementById('change');
    var spoken = document.getElementById('spoken');
    var status = document.getElementById('status');
    var HINT = status.textContent;
    var busy = false;
    var round = 0;                   // which press is being saved; an older press no longer changes the page
    var next = null;                 // the try that is waiting for its pause, if any

    // kind: '' the quiet line, 'bad' something went wrong, 'invalid' the address itself is wrong
    function say(text, kind) {
      status.textContent = text;
      status.className = kind ? 'status bad' : 'status';
      if (kind === 'invalid') input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    }

    // The same rule as the sheet's script, so the page never accepts what the sheet refuses.
    function clean(value) {
      var email = String(value || '').replace(/^\s+|\s+$/g, '').toLowerCase();
      if (email.length < 6 || email.length > 254) return '';
      if (!/^[a-z0-9_][a-z0-9._%+\-]{0,63}@[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?)*\.[a-z]{2,24}$/.test(email)) return '';
      var local = email.slice(0, email.indexOf('@'));
      if (local.indexOf('..') >= 0 || local.charAt(local.length - 1) === '.') return '';
      return email;
    }

    // One request. Only the sheet's own word counts as an answer: "OK", "NO" or "BUSY".
    // Anything else (no connection, no answer in time, an answer that cannot be read) is a failure.
    function post(email, onReply, onFail) {
      var ctl = window.AbortController ? new AbortController() : null;
      var over = false;
      function end(fn, arg) { if (over) return; over = true; clearTimeout(timer); fn(arg); }
      var timer = setTimeout(function () { end(onFail); if (ctl) { try { ctl.abort(); } catch (err) {} } }, LIMIT);
      var request = {
        method: 'POST', mode: 'cors', credentials: 'omit', cache: 'no-store',
        redirect: 'follow', referrerPolicy: 'no-referrer', keepalive: true,
        body: 'email=' + encodeURIComponent(email) + '&company=' + encodeURIComponent(trap.value) + '&from=' + encodeURIComponent(location.hostname)
      };
      if (ctl) request.signal = ctl.signal;
      var sent;
      try { sent = fetch(ENDPOINT, request); } catch (err) { end(onFail); return; }
      sent.then(function (res) {
        if (!res.ok) { end(onReply, 'BUSY'); return; }
        res.text().then(function (text) { end(onReply, String(text || '').replace(/\s+$/, '')); }, function () { end(onFail); });
      }, function () { end(onFail); });
    }

    // Saves the address; on "busy" or a failure it tries again, twice, after a pause.
    function save(email, attempt, since, mine, onSaved, onRefused, onFailed) {
      function again() {
        if (mine !== round) return;
        if (attempt >= WAITS.length || Date.now() - since > PATIENCE) { onFailed(); return; }
        var run = function () {
          if (next !== run) return;
          next = null;
          save(email, attempt + 1, since, mine, onSaved, onRefused, onFailed);
        };
        next = run;
        setTimeout(run, WAITS[attempt]);
      }
      post(email, function (reply) {
        if (reply === 'OK') onSaved();
        else if (reply === 'NO') onRefused();
        else again();
      }, again);
    }

    // A try that is waiting for its pause is sent at once when the page is being left:
    // the browser finishes a request that is already on its way, but not one that has not started.
    function hurry() { if (next) next(); }
    window.addEventListener('pagehide', hurry);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') hurry(); });

    function showDone(email) {
      saved.textContent = email;
      form.hidden = true;
      done.hidden = false;
      say('', '');
      spoken.textContent = 'You\'re on the list.';
    }
    function showForm(text, kind) {
      done.hidden = true;
      form.hidden = false;
      spoken.textContent = '';
      say(text, kind);
      try { input.focus(); } catch (err) {}
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (busy) return;
      var email = clean(input.value);

        say(input.value.replace(/\s/g, '') ? 'Please check the email address.' : 'Please type your email address.', 'invalid');
        try { input.focus(); } catch (err) {}
        return;
      }
      if (!ENDPOINT) { say('Sign-up is not open yet. Please come back soon.', 'bad'); return; }
      if (!window.fetch) { say('Please try another browser to sign up.', 'bad'); return; }
      if (navigator.onLine === false) { say('You seem to be offline. Please try again later.', 'bad'); return; }
      busy = true;
      var mine = ++round;
      // The thank-you appears at once; the address is saved meanwhile. If it cannot be saved, the form comes back.
      showDone(email);

      save(email, 0, Date.now(), mine, function () {
        if (mine !== round) return;
        busy = false;
        input.value = '';
      }, function () {
        if (mine !== round) return;
        busy = false;
        showForm('Please check the email address.', 'invalid');
      }, function () {
        if (mine !== round) return;
        busy = false;
        showForm('We could not save it just now. Please try again.', 'bad');
      });
    });

    // "Change" under the thank-you: the form comes back with the address, to correct a slip.
    change.addEventListener('click', function (event) {
      event.preventDefault();
      round++;
      next = null;
      busy = false;
      input.value = saved.textContent;
      showForm(HINT, '');
    });
    change.addEventListener('keydown', function (event) {
      if (event.key === ' ' || event.key === 'Spacebar') { event.preventDefault(); change.click(); }
    });

    input.addEventListener('input', function () {
      if (status.className !== 'status' || status.textContent !== HINT) say(HINT, '');
    });
  })();
  </script>
</body>
</html>
